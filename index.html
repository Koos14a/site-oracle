<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de TI</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#172033;--mut:#68758b;--bd:#e2e8f0;--ac:#1769e0;--hero:#10284c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 8% 0%,#e5efff 0,transparent 30%),var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0 22px;font-weight:750}
header .brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:44px;max-width:180px;object-fit:contain}
#empresa{font-size:1.04rem;letter-spacing:-.02em}
#hor{color:var(--mut);font-weight:600;font-size:.9rem}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#10284c 0%,#174d91 60%,#1769e0 100%);color:#fff;border-radius:24px;padding:58px 30px;text-align:left;margin-bottom:28px;box-shadow:0 20px 45px rgba(16,40,76,.18)}
.hero:after{content:"";position:absolute;width:340px;height:340px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-70px;top:-150px;box-shadow:0 0 0 35px rgba(255,255,255,.035),0 0 0 70px rgba(255,255,255,.025)}
.hero h1{position:relative;z-index:1;margin:0 0 10px;font-size:clamp(2rem,4vw,2.8rem);line-height:1.1;letter-spacing:-.045em;max-width:620px}
.hero p{position:relative;z-index:1;margin:0 0 25px;color:#dceaff;max-width:610px;font-size:1.02rem}
.btn{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;background:#ff8a27;color:#15243c;padding:13px 21px;border-radius:11px;font-weight:800;text-decoration:none;font-size:1rem;box-shadow:0 8px 18px rgba(0,0,0,.15);transition:.15s}
.btn:hover{transform:translateY(-2px);background:#ffa044}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none;font-weight:650;padding:12px 17px;margin-left:8px}
h2{font-size:1.25rem;letter-spacing:-.025em;margin:30px 0 13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:19px;box-shadow:0 8px 24px rgba(23,45,80,.045);transition:transform .16s,box-shadow .16s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(23,45,80,.09)}
.card .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#edf4ff;font-size:1.35rem;margin-bottom:11px}
.card b{display:block;margin:4px 0 3px;font-size:.98rem}
.card span,.card a{color:var(--mut);font-size:.92rem;word-break:break-word}
.card a{color:var(--ac);font-weight:650;text-decoration:none}
.card a:hover{text-decoration:underline}
#q{width:100%;padding:12px 14px;border:1px solid #d8e1ed;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px;outline:none}
#q:focus{border-color:#6da4f5;box-shadow:0 0 0 3px rgba(23,105,224,.12)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:9px;box-shadow:0 4px 12px rgba(23,45,80,.025)}
summary{cursor:pointer;padding:14px 16px;font-weight:650;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";float:right;color:var(--ac);font-size:1.15rem}
details[open] summary:after{content:"−"}
details div{padding:0 16px 16px;color:var(--mut);white-space:pre-line}
.none{color:var(--mut);text-align:center;padding:16px;display:none}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:30px 0 14px;border-top:1px solid var(--bd);margin-top:32px}
@media(max-width:600px){.wrap{padding:14px}.hero{padding:38px 21px;border-radius:18px}.hero h1{font-size:2rem}.btn.sec{margin:10px 0 0}.hero:after{right:-230px}header{align-items:flex-start;flex-direction:column;gap:4px}}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand"><img id="logo" class="logo" alt="" hidden><span id="empresa"></span></span><span style="color:var(--mut);font-weight:500;font-size:.9rem" id="hor"></span></header>

  <section class="hero">
    <h1>Suporte de TI, sem complicação.</h1>
    <p>Conte o que aconteceu e nossa equipe vai ajudar. Abra seu chamado e acompanhe cada atualização por aqui.</p>
    <a class="btn" id="abrir" href="#">Abrir chamado</a>
    <a class="btn sec" id="acomp" href="#">Acompanhar meus chamados</a>
  </section>

  <h2>Contatos</h2>
  <div class="grid" id="contatos"></div>

  <h2>Perguntas frequentes</h2>
  <input id="q" type="search" placeholder="Buscar nas perguntas (ex.: senha, impressora, wi-fi)">
  <div id="faq"></div>
  <div class="none" id="none">Nada encontrado. Se não achou sua resposta, abra um chamado.</div>

  <footer id="rodape"></footer>
</div>

<script>
/* ============ EDITE AQUI ============ */
var CONFIG = {
  empresa: "Smart Informática e Tecnologia",
  logo: "logo.png",                               // coloque o arquivo da logo na mesma pasta
  horario: "08h às 18h",                         // horario de atendimento informado
  urlChamados: "/chamados",                    // já aponta para o sistema no mesmo site; não precisa mudar
  contatos: [
    {icone: "📞", titulo: "Telefone", valor: "(61) 3626-5484", link: "tel:+556136265484"}
    // Exemplos para adicionar (apague o que não usar):
    // ,{icone: "✉️", titulo: "E-mail", valor: "ti@seudominio.com.br", link: "mailto:ti@seudominio.com.br"}
    // ,{icone: "📍", titulo: "Onde estamos", valor: "Endereço ou sala"}
    ],
  faq: [
    {p: "Esqueci minha senha. O que faço?",
     r: "Abra um chamado na categoria Acesso/Senha informando seu nome e setor. Por segurança, a TI pode pedir uma confirmação antes de redefinir."},
    {p: "Como tirar um print da tela para anexar ao chamado?",
     r: "Pressione Windows + Shift + S, selecione a área do erro e, no formulário do chamado, use Ctrl + V para colar.\nTambém dá para anexar a imagem pelo botão de arquivos."},
    {p: "A impressora não imprime.",
     r: "1. Veja se está ligada, com papel e sem mensagem de erro no visor.\n2. No computador, cancele documentos presos na fila.\n3. Se continuar, abra um chamado informando o nome ou local da impressora."},
    {p: "Meu computador está lento.",
     r: "Salve seu trabalho e reinicie o computador (o desligar com a tecla Shift nem sempre reinicia de fato). Se a lentidão persistir, abra um chamado e informe quando começou."},
    {p: "Estou sem internet ou sem acesso ao Wi-Fi.",
     r: "Confira se o cabo de rede está conectado ou se o Wi-Fi está ligado. Se só você está sem acesso, abra um chamado. Se todo o setor está sem, ligue para a TI: (61) 3626-5484."},
    {p: "Como acompanho meu chamado?",
     r: "Depois de abrir, você recebe uma página de acompanhamento. Guarde o endereço. Seus chamados também aparecem na tela inicial do sistema, neste mesmo computador."},
    {p: "O que é prioridade Alta?",
     r: "Use Alta quando você está impedido de trabalhar ou quando o problema afeta várias pessoas. Para o restante, escolha Média ou Baixa."}
  ]
};
/* ================================== */

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
document.title=CONFIG.empresa;
document.getElementById("empresa").textContent=CONFIG.empresa;
document.getElementById("hor").textContent=CONFIG.horario||"";
var lg=document.getElementById("logo");
if(CONFIG.logo){lg.onload=function(){lg.hidden=false;document.getElementById("empresa").textContent=CONFIG.empresa};lg.onerror=function(){lg.hidden=true};lg.src=CONFIG.logo}
document.getElementById("abrir").href=CONFIG.urlChamados;
document.getElementById("acomp").href=CONFIG.urlChamados;
document.getElementById("rodape").textContent=CONFIG.empresa+" · "+CONFIG.contatos[0].valor+(CONFIG.horario?" · "+CONFIG.horario:"");

var cg=document.getElementById("contatos");
CONFIG.contatos.forEach(function(c){
  var d=el("div","card");d.appendChild(el("div","ic",c.icone));d.appendChild(el("b",null,c.titulo));
  if(c.link){var a=el("a",null,c.valor);a.href=c.link;d.appendChild(a)}else d.appendChild(el("span",null,c.valor));
  cg.appendChild(d);
});

var fq=document.getElementById("faq"),itens=[];
CONFIG.faq.forEach(function(f){
  var d=el("details"),s=el("summary",null,f.p),r=el("div",null,f.r);
  d.appendChild(s);d.appendChild(r);fq.appendChild(d);itens.push({d:d,t:(f.p+" "+f.r).toLowerCase()});
});
document.getElementById("q").addEventListener("input",function(e){
  var v=e.target.value.toLowerCase().trim(),n=0;
  itens.forEach(function(i){var ok=!v||i.t.indexOf(v)>-1;i.d.style.display=ok?"":"none";if(ok)n++;if(v&&ok)i.d.open=true;if(!v)i.d.open=false});
  document.getElementById("none").style.display=n?"none":"block";
});
</script>
</body>
</html>
